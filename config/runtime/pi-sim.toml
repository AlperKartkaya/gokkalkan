schema_version = 1
profile = "SIM"

[api]
host = "127.0.0.1"
port = 8088
allowed_origins = [
  "http://127.0.0.1:4173",
  "http://localhost:4173",
  "http://[::1]:4173",
]

[mcu]
transport = "arduino_serial"
port = "loop://"
baudrate = 115200
field_profile = "GKK-UNO-DM542-1600PPR-R1"
heartbeat_timeout_ms = 2000

[safety]
pan_min_deg = -75.0
pan_max_deg = 75.0
tilt_min_deg = -10.0
tilt_max_deg = 45.0
command_timeout_ms = 750
zone_schema_version = 1
arm_hold_ms = 2000
arm_timeout_ms = 3000
motion_forbidden_zones = [
  { name = "rear-left", pan_min_deg = -180.0, pan_max_deg = -75.0, tilt_min_deg = -90.0, tilt_max_deg = 90.0 },
  { name = "rear-right", pan_min_deg = 75.0, pan_max_deg = 180.0, tilt_min_deg = -90.0, tilt_max_deg = 90.0 },
]
fire_forbidden_zones = [
  { name = "rear-left", pan_min_deg = -180.0, pan_max_deg = -75.0, tilt_min_deg = -90.0, tilt_max_deg = 90.0 },
  { name = "rear-right", pan_min_deg = 75.0, pan_max_deg = 180.0, tilt_min_deg = -90.0, tilt_max_deg = 90.0 },
]
live_output_enabled = false

[telemetry]
path = "/var/lib/gokkalkan/telemetry/operator-api-sim.jsonl"
max_bytes = 52428800
min_free_bytes = 268435456

[sensors]
camera_backend = "auto"
camera_device = 0
track_stale_ms = 500
lidar_stale_ms = 300
lidar_min_m = 0.2
lidar_max_m = 50.0
classification_min_confidence = 0.40
# Raspberry Pi 5 GPIO header pin 8/10 requires `dtoverlay=uart0-pi5` at boot.
# `/dev/serial0` is the Pi 5 debug UART (ttyAMA10), not this header UART.
lidar_port = "/dev/ttyAMA0"
lidar_baud_rate = 460800
lidar_sample_hz = 1000
lidar_serial_number = "UNVERIFIED"
lidar_firmware_version = "UNVERIFIED"
lidar_calibration_path = "config/calibration/tfa50_l.toml"
lidar_mount_revision = "BRIDGE-UNVERIFIED"
# Hardware UART (GPIO Pins 8/10) on Raspberry Pi 5
lidar_input_enabled = false

[live]
interlock_provider = ""
readiness_provider = ""
operator_token_file = ""
