schema_version = 1
target = "raspberry-pi-5"

[os]
family = "Raspberry Pi OS Lite 64-bit"
version_id = "13"
codename = "trixie"
allowed_ids = ["debian", "raspbian"]
architecture = "aarch64"

[runtime]
user = "gokkalkan"
group = "gokkalkan"
install_dir = "/opt/gokkalkan"
venv_dir = "/opt/gokkalkan/.venv"
config_dir = "/etc/gokkalkan"
state_dir = "/var/lib/gokkalkan"
python = "3.13"
frontend_dist_required = true

[packages]
apt = [
  "ca-certificates",
  "can-utils",
  "chrony",
  "dkms",
  "git",
  "hailo-all",
  "python3",
  "python3-dev",
  "python3-numpy",
  "python3-opencv",
  "python3-picamera2",
  "python3-pip",
  "python3-venv",
  "rsync",
  "rpicam-apps",
  "v4l-utils",
]

[permissions]
groups = ["dialout", "gpio", "render", "video"]
runtime_config_mode = "0640"
operator_token_mode = "0640"

[can]
interface = "can0"
bitrate = 500000
protocol = "classical-can-2.0b"
driver_configuration = "electronics-specific"

[camera]
stack = "libcamera-picamera2"
model = "Raspberry Pi Camera Module 3 Standard"
count = 1
horizontal_fov_deg = 66.0
follows_yaw = true
follows_weapon_pitch = false
legacy_camera_stack = false
required_device_patterns = ["/dev/video*", "/dev/media*"]

[lidar]
model = "TFA50-L"
optical_center_height_m = 0.700
follows_yaw = true
follows_weapon_pitch = false

[accelerator]
model = "Raspberry Pi AI HAT+"
variant_tops = 26
chip = "Hailo-8"
interface = "PCIe"
verification_command = "hailortcli fw-control identify"

[verification]
runtime_profile = "SIM"
runtime_config = "/etc/gokkalkan/runtime.toml"
api_health = "http://127.0.0.1:8088/health"
ui_health = "http://127.0.0.1:4173/healthz"
