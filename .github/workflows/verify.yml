name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked Python environment
        run: |
          python -m pip install "pip==25.1.1" "setuptools==75.6.0" "wheel==0.45.1"
          python -m pip install -r requirements/dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Install locked frontend environment
        run: npm --prefix frontend ci
      - name: Verify package, config and tests
        run: |
          gokkalkan doctor --config config/runtime/sim.toml --json
          python scripts/verify_pi_manifest.py --manifest-only
          python -m pytest
          npm run typecheck
          npm run test:unit
          npm run test:desktop
          npm run build
      - name: Dry-run stack smoke
        run: npm run dev:check
