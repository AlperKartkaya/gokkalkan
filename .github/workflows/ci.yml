name: Gökkalkan CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx uvicorn

      - name: Run Pytest
        env:
          PYTHONPATH: backend/src
        run: |
          pytest tests/ -v

  frontend-test:
    name: Frontend Typecheck & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test:unit
